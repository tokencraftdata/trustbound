<text x="575.0" y="376" dominant-baseline="middle" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#142c43">Durable journal + dispatch</text>
<text x="575.0" y="409" dominant-baseline="middle" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#142c43">Existing rights may survive the fence</text>
