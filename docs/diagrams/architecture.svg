<text x="575.0" y="236" dominant-baseline="middle" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#142c43">Admission + serialized fence</text>
<text x="575.0" y="269" dominant-baseline="middle" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#142c43">Record before granting authority</text>
<text x="575.0" y="296" dominant-baseline="middle" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#142c43">A1-A3 are deployment premises</text>
