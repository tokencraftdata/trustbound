<text x="40" y="660" dominant-baseline="middle" text-anchor="start" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#142c43">No agent access to</text>
<text x="40" y="690" dominant-baseline="middle" text-anchor="start" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#142c43">service keys, host</text>
<text x="40" y="720" dominant-baseline="middle" text-anchor="start" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#142c43">or journal is assumed.</text>
