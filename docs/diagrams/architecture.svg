<text x="575.0" y="539" dominant-baseline="middle" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#142c43">Unknown outcomes stay unresolved</text>
<text x="575.0" y="566" dominant-baseline="middle" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#142c43">No inference from silence alone</text>
